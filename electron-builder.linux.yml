# Lumen Notes · Linux x64 打包配置（AppImage + deb + rpm）
#
# 推荐入口: npm run dist:linux   →   bash build-linux-all.sh
#   脚本会按本机 rpm 工具情况动态生成目标列表与临时配置，并做产物自检。
# 手动直打（仅当你已自行解决 fpm / rpmbuild 依赖时）:
#   npx electron-builder --linux --x64 --config electron-builder.linux.yml
#
# Windows 主机不能交叉构建 deb / rpm / AppImage（缺 fpm、mksquashfs 等
# Linux 原生工具），因此 Linux 配置单独保留，不影响 electron-builder.yml。

appId: com.lumennotes.desktop
productName: Lumen Notes
copyright: Copyright © 2026

directories:
  output: release-linux-v1
  buildResources: electron

# forked 同步服务、express.static(dist)、chokidar 监视都按真实文件系统路径
# 工作；asar 会让写入配置与 dist 读取失败，必须为 false。
asar: false

# dist/ 在 .gitignore 中，必须显式列回。
# 生产依赖由 electron-builder 自动收集，不要写 node_modules/**/*。
files:
  - package.json
  - dist/**/*
  - electron/**/*
  - server/**/*

linux:
  target:
    - AppImage
    - deb
    - rpm
  category: Utility
  # 与 package.json 的 homepage 一致。.invalid 是 RFC 2606 保留的不可解析
  # 域名，明确表示「尚未设置官网」，不会被误认成真实站点。
  maintainer: Lumen Notes <noreply@lumen-notes.invalid>
  synopsis: Local-first Markdown notes editor
  description: >
    Lumen Notes is a local-first Markdown editor with vault sync,
    timeline history and side-by-side conflict resolution.
  mimeTypes:
    - text/markdown
  artifactName: LumenNotes-${version}-linux-${arch}.${ext}
  # Electron 33 把 package.json 的 desktopName 当作 Wayland app_id / X11
  # WM_CLASS。不设置时 StartupWMClass 会是 "Lumen Notes"，与窗口实际的
  # lumen-notes 不匹配，任务栏无法把窗口关联到 .desktop。
  syncDesktopName: true

appImage:
  artifactName: LumenNotes-${version}-linux-${arch}.AppImage
  # electron-builder 26 默认把 --no-sandbox 写进 AppImage 的 .desktop
  # (AppImageTarget.js defaultArgs)，无条件关掉 Chromium 沙箱。置空后
  # AppRun 会先用 `unshare -Ur true` 探测，仅在系统不支持用户命名空间时
  # 才自动补 --no-sandbox，既保留沙箱又保证可启动。
  executableArgs: []

deb:
  artifactName: LumenNotes-${version}-linux-${arch}.deb
  packageCategory: utils
  priority: optional
  # %F 传本地路径列表；注意 executableArgs 只放各 target，不放 linux 下，
  # 否则 deepAssign 不会让 appImage 的空数组覆盖，AppImage Exec 会变成
  # "AppRun %F %U"（.desktop 规范不允许两个文件参数码）。
  executableArgs:
    - '%F'
  # electron-builder 26 默认只声明 9 个包；打包后的二进制还链接了
  # libgbm/libasound/libatk/libcups/libdrm/libxkbcommon 等，最小化安装
  # 的系统可能缺库。用 "A | B" 兼容 Ubuntu 24.04 的 *t64 改名。
  depends:
    - 'libgtk-3-0 | libgtk-3-0t64'
    - libnotify4
    - libnss3
    - libnspr4
    - libxss1
    - libxtst6
    - xdg-utils
    - 'libatspi2.0-0 | libatspi2.0-0t64'
    - 'libatk1.0-0 | libatk1.0-0t64'
    - libuuid1
    - libsecret-1-0
    - libgbm1
    - libdrm2
    - 'libasound2 | libasound2t64'
    - 'libcups2 | libcups2t64'
    - libxkbcommon0
    - libxcomposite1
    - libxdamage1
    - libxfixes3
    - libxrandr2
    - libpango-1.0-0
    - libcairo2
    - libdbus-1-3

rpm:
  artifactName: LumenNotes-${version}-linux-${arch}.rpm
  compression: xz
  packageCategory: Applications/Utility
  executableArgs:
    - '%F'
  # FpmTarget 的 rpm 默认 depends 只有 8 项 Fedora 名，缺 ldd 实际链接的
  # libgbm/alsa/cups/libxkbcommon 等。写了 depends 会完全替换默认值，
  # 所以默认 8 项必须一并保留。用 "(A or B)" 兼容 Fedora/RHEL 与 openSUSE。
  depends:
    - gtk3
    - libnotify
    - nss
    - nspr
    - libXScrnSaver
    - '(libXtst or libXtst6)'
    - xdg-utils
    - at-spi2-core
    - atk
    - '(libuuid or libuuid1)'
    - libsecret
    - '(mesa-libgbm or libgbm1)'
    - '(libdrm or libdrm2)'
    - '(alsa-lib or libasound2)'
    - '(cups-libs or libcups2)'
    - '(libxkbcommon or libxkbcommon0)'
    - '(libXcomposite or libxcomposite1)'
    - '(libXdamage or libxdamage1)'
    - '(libXfixes or libXfixes3)'
    - '(libXrandr or libXrandr2)'
    - '(pango or libpango-1.0-0)'
    - '(cairo or libcairo2)'
    - '(dbus-libs or libdbus-1-3)'
